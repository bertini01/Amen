<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
   * { margin: 0; box-sizing: border-box; }
   body { background: #000; }
   .art {
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif;
      color: #fff;
      background:
         radial-gradient(ellipse at 50% 38%, rgba(0, 102, 255, 0.34) 0%, rgba(0, 102, 255, 0.10) 32%, transparent 60%),
         radial-gradient(ellipse at 50% 120%, rgba(51, 133, 255, 0.22) 0%, transparent 55%),
         linear-gradient(180deg, #0d0f1c 0%, #0a0a11 55%, #070710 100%);
   }
   .logo { filter: drop-shadow(0 0 60px rgba(51, 133, 255, 0.45)); }
   .name { font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
   .name span { color: #5a9dff; }
   .tag { font-weight: 600; color: #8fb8ff; text-transform: uppercase; opacity: 0.9; }
   .bars { position: absolute; left: 0; right: 0; display: flex; justify-content: center; align-items: center; opacity: 0.22; }
   .bars i { display: block; background: linear-gradient(180deg, #5ab0ff, #0066ff); }

   #box { width: 2160px; height: 2160px; }
   #box .logo { width: 1180px; margin-top: -60px; }
   #box .name { font-size: 230px; margin-top: 90px; }
   #box .tag { font-size: 64px; letter-spacing: 0.32em; margin-top: 60px; }

   #poster { width: 1440px; height: 2160px; }
   #poster .logo { width: 1020px; margin-top: -330px; }
   #poster .name { font-size: 190px; margin-top: 110px; }
   #poster .tag { font-size: 52px; letter-spacing: 0.3em; margin-top: 56px; }
   #poster .bars { bottom: 110px; gap: 26px; height: 200px; }
   #poster .bars i { width: 26px; border-radius: 13px; }
</style>
</head>
<body>
   <div id="box" class="art">
      <img class="logo" src="../../public/logo.png">
      <div class="name">Amen <span>Studio</span></div>
      <div class="tag">Listen · Capture · Create</div>
   </div>

   <div id="poster" class="art">
      <img class="logo" src="../../public/logo.png">
      <div class="name">Amen<br><span>Studio</span></div>
      <div class="tag">Listen · Capture · Create</div>
      <div class="bars"></div>
   </div>

   <script>
      // Waveform motif along the poster's foot, echoing the bars inside the logo.
      const heights = [18, 34, 52, 30, 70, 46, 92, 60, 100, 74, 52, 88, 40, 64, 30, 48, 22, 36, 16];
      const bars = document.querySelector("#poster .bars");
      for (const h of heights) {
         const i = document.createElement("i");
         i.style.height = h + "%";
         bars.appendChild(i);
      }
   </script>
</body>
</html>
